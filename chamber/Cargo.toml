[package]
name = "chamber-gnoland"
version = "0.1.0"
edition = "2024"
description = "A Rust wallet library for gno.land: BIP39/BIP44 keys, gno addresses, secp256k1 signing, encrypted keystore"
license = "MIT"
repository = "https://github.com/jeronimoalbi/chamber"
keywords = ["gno", "gnoland", "wallet", "secp256k1", "bip39"]
categories = ["cryptography::cryptocurrencies"]

[lib]
name = "chamber"
path = "src/lib.rs"

[dependencies]
bip39 = "2.1"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic", "std"] }
sha2 = "0.10"
ripemd = "0.1"
hmac = "0.12"
bech32 = "0.11"
getrandom = "0.2"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
hex = "0.4"
